<meta name="claude:viewport-fit-sides" content="cover">
<title>إتقان</title>
<style>
/* ===== إتقان — منصة جاهزية مخيمات الحج | هوية ARKINIUM =====
   Layout: splash intro → role-based app shell (header + content + bottom tabs).
   Color: warm earthen identity (brown/beige/off-white) from the Arkinium brand. */
:root{
  --bg:#F4F1EA; --surface:#FFFFFF; --surface-2:#FBF9F4; --surface-3:#F3EEE4;
  --border:#E7DECF; --border-2:#DED3C0;
  --text:#2A221E; --muted:#8C7D71; --muted-2:#A89A8D;
  --brand:#5A4A42; --brand-2:#6E5C52; --brand-ink:#3E322D;
  --beige:#D6C9B8; --beige-2:#E6DED1; --sand:#C1B2A0;
  --ok:#4F7A4A; --ok-bg:#E8F0E6; --warn:#B07d26; --warn-bg:#FaF0DA;
  --bad:#B0463C; --bad-bg:#F7E4E1; --info:#45687E; --info-bg:#E6EDF2;
  --radius:16px; --radius-sm:11px;
  --shadow:0 1px 3px rgba(42,34,30,.07),0 1px 2px rgba(42,34,30,.04);
  --shadow-md:0 6px 18px rgba(42,34,30,.10);
  --shadow-lg:0 16px 44px rgba(42,34,30,.18);
  --font:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --display:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1713; --surface:#262019; --surface-2:#2D261E; --surface-3:#342C23;
  --border:#3B3127; --border-2:#473b2f;
  --text:#F1EBE2; --muted:#AD9F91; --muted-2:#8E8173;
  --brand:#CDB89F; --brand-2:#D8CBB7; --brand-ink:#E8DFD0;
  --beige:#4A3E33; --beige-2:#3A3027; --sand:#7d6d5d;
  --ok:#86C27E; --ok-bg:#243226; --warn:#E0B266; --warn-bg:#352B1A;
  --bad:#E89488; --bad-bg:#382320; --info:#8FB4CC; --info-bg:#1F2B33;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 6px 18px rgba(0,0,0,.45);
  --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1C1713; --surface:#262019; --surface-2:#2D261E; --surface-3:#342C23;
  --border:#3B3127; --border-2:#473b2f;
  --text:#F1EBE2; --muted:#AD9F91; --muted-2:#8E8173;
  --brand:#CDB89F; --brand-2:#D8CBB7; --brand-ink:#E8DFD0;
  --beige:#4A3E33; --beige-2:#3A3027; --sand:#7d6d5d;
  --ok:#86C27E; --ok-bg:#243226; --warn:#E0B266; --warn-bg:#352B1A;
  --bad:#E89488; --bad-bg:#382320; --info:#8FB4CC; --info-bg:#1F2B33;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-md:0 6px 18px rgba(0,0,0,.45);
  --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);direction:rtl}
body{text-align:right;min-height:100%;-webkit-tap-highlight-color:transparent;line-height:1.6}
h1,h2,h3,h4{margin:0;line-height:1.3}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
.wordmark{font-family:var(--display);letter-spacing:.5px}

/* ===== Splash ===== */
#splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(120% 120% at 50% 0%,#6E5C52 0%,#4A3C35 55%,#332824 100%);color:#F4F1EA;transition:opacity .6s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-logo{width:120px;height:120px;opacity:0;transform:translateY(14px) scale(.9);animation:rise .9s .1s forwards cubic-bezier(.2,.7,.3,1)}
.splash-name{font-family:var(--display);font-size:46px;font-weight:700;letter-spacing:2px;opacity:0;transform:translateY(12px);animation:rise .9s .45s forwards cubic-bezier(.2,.7,.3,1)}
.splash-sub{font-size:14.5px;color:#D6C9B8;opacity:0;animation:fade 1s .8s forwards;text-align:center;max-width:300px;padding:0 20px}
.splash-brand{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom,0px));font-size:11px;letter-spacing:3px;color:#B7A590;opacity:0;animation:fade 1s 1.1s forwards}
.splash-bar{width:120px;height:3px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;opacity:0;animation:fade .6s .9s forwards}
.splash-bar i{display:block;height:100%;width:0;background:#D6C9B8;animation:load 1.6s .9s forwards ease-out}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes load{to{width:100%}}

/* ===== Generic ===== */
.hidden{display:none!important}
.app-wrap{max-width:860px;margin:0 auto}
.screen-pad{padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(135deg,var(--brand),var(--brand-ink));color:#F4F1EA;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow-md)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--brand)}
.header .h-title{display:flex;align-items:center;gap:10px;min-width:0}
.header .h-title .mk{width:30px;height:30px;flex:none}
.header h1{font-family:var(--display);font-size:19px;letter-spacing:1px}
.header .h-role{font-size:11.5px;color:#DCCFBE;margin-top:1px}
.header .h-actions{display:flex;align-items:center;gap:6px}
.icon-btn{position:relative;background:rgba(255,255,255,.14);border:0;color:#F4F1EA;width:38px;height:38px;border-radius:11px;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:rgba(255,255,255,.24)}
.badge-dot{position:absolute;top:5px;inset-inline-start:6px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:#E05a4b;color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}

.tabbar{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 14px rgba(42,34,30,.06)}
.tabbar .app-wrap{display:flex;width:100%}
.tabbar button{flex:1;border:0;background:none;padding:9px 2px 7px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tabbar button .ic{font-size:19px;line-height:1}
.tabbar button.active{color:var(--brand);font-weight:700}
.tabbar button.active .ic{transform:translateY(-1px)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.pad-sm{padding:13px}
.card h2{font-size:16px;margin-bottom:3px}
.card .sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.sec-title{font-family:var(--display);font-size:15px;font-weight:700;margin:6px 2px 12px;display:flex;align-items:center;gap:8px}
.sec-title .line{flex:1;height:1px;background:var(--border)}

.field{margin-bottom:13px}
.field > label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field .req{color:var(--bad);font-weight:700}
.input,input[type=text],input[type=password],input[type=number],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--border-2);border-radius:var(--radius-sm);font-size:15px;background:var(--surface);color:var(--text)}
.input:focus,input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
textarea{resize:vertical;min-height:80px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:430px){.row-2{grid-template-columns:1fr}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 16px;border:0;border-radius:var(--radius-sm);
  font-size:14.5px;font-weight:700;cursor:pointer;background:var(--brand);color:#F4F1EA;transition:filter .15s,background .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border-2)}
.btn.ghost:hover{background:var(--surface-3);filter:none}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.warn{background:var(--warn)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.xs{padding:5px 9px;font-size:12px;border-radius:8px}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--info-bg);color:var(--info)}
.p-mut{background:var(--surface-3);color:var(--muted)}
.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--border-2);background:var(--surface);font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.chip.active{background:var(--brand);color:#F4F1EA;border-color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}

.list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.list-item:hover{border-color:var(--brand)}
.li-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.li-title{font-weight:700;font-size:14px}
.li-meta{color:var(--muted);font-size:11.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 12px}
.empty{text-align:center;color:var(--muted);padding:44px 16px}
.empty .ic{font-size:42px;display:block;margin-bottom:10px;opacity:.5}
.divider{height:1px;background:var(--border);margin:14px 0}

/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px}
.stat .n{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat .l{color:var(--muted);font-size:12px;margin-top:5px}
.stat.s-ok .n{color:var(--ok)}.stat.s-warn .n{color:var(--warn)}.stat.s-bad .n{color:var(--bad)}.stat.s-brand .n{color:var(--brand)}
.bar{margin-bottom:9px}
.bar .bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.bar .bt{height:8px;border-radius:9px;background:var(--surface-3);overflow:hidden;border:1px solid var(--border)}
.bar .bf{height:100%;border-radius:9px;background:var(--brand)}

/* criterion / documentation */
.doc-box{border:1px dashed var(--border-2);border-radius:var(--radius-sm);padding:10px;background:var(--surface-2);display:flex;align-items:center;gap:10px}
.doc-thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;border:1px solid var(--border);flex:none;background:var(--surface-3)}
.cap-btn{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid var(--brand);color:var(--brand);background:color-mix(in srgb,var(--brand) 8%,transparent);border-radius:10px;font-size:13px;font-weight:700;cursor:pointer}
.cap-done{color:var(--ok);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px}
.toggle-2{display:flex;gap:8px}
.toggle-2 label{flex:1;text-align:center;padding:9px;border:1px solid var(--border-2);border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;background:var(--surface)}
.toggle-2 input{display:none}
.toggle-2 label.y:has(input:checked){border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.toggle-2 label.n:has(input:checked){border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
#modal[hidden]{display:none}
.m-back{position:absolute;inset:0;background:rgba(42,34,30,.55)}
.m-card{position:relative;background:var(--surface);width:100%;max-width:580px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px;
  padding-bottom:max(18px,env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
@media(min-width:620px){#modal{align-items:center}.m-card{border-radius:20px}}
.m-card h3{font-family:var(--display);font-size:17px;margin-bottom:12px}
.d-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13.5px}
.d-row:last-child{border-bottom:0}
.d-row .k{color:var(--muted)} .d-row .v{font-weight:600;text-align:left}

/* toast */
#toast{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;justify-content:center;pointer-events:none;padding:0 16px}
#toast[hidden]{display:none}
#toast .t{background:var(--brand-ink);color:#F4F1EA;padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:var(--shadow-lg);max-width:90%;text-align:center}
#toast .t.ok{background:var(--ok)} #toast .t.bad{background:var(--bad)}

/* auth */
.auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:22px;
  padding-top:max(22px,env(safe-area-inset-top,0px));padding-bottom:max(22px,env(safe-area-inset-bottom,0px));
  background:radial-gradient(130% 100% at 50% 0%,var(--surface-3),var(--bg))}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow-lg);padding:26px 22px}
.auth-logo{text-align:center;margin-bottom:20px}
.auth-logo .mk{width:66px;height:66px;margin-bottom:10px}
.auth-logo h1{font-family:var(--display);font-size:27px;letter-spacing:2px;color:var(--brand)}
.auth-logo p{color:var(--muted);font-size:12.5px;margin-top:3px}
.demo-box{margin-top:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:11px 12px;font-size:11.5px;color:var(--muted)}
.demo-box b{color:var(--text)}
.demo-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:6px}

/* timeline */
.tl{position:relative;padding-inline-start:18px;margin-top:6px}
.tl::before{content:"";position:absolute;inset-inline-start:4px;top:4px;bottom:4px;width:2px;background:var(--border)}
.tl-item{position:relative;padding:0 0 12px}
.tl-item::before{content:"";position:absolute;inset-inline-start:-18px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tl-item .tl-h{font-size:13px;font-weight:700}
.tl-item .tl-m{font-size:11.5px;color:var(--muted)}

.fab{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));z-index:25;
  width:56px;height:56px;border-radius:50%;background:var(--brand);color:#F4F1EA;border:0;font-size:26px;box-shadow:var(--shadow-lg);cursor:pointer}

.builder-field{border:1px solid var(--border-2);border-radius:var(--radius-sm);padding:11px;margin-bottom:9px;background:var(--surface-2)}
.builder-field .bf-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--surface-3);color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

<div id="splash">
  <svg class="splash-logo" viewBox="0 0 100 100" fill="none" aria-hidden="true">
    <path d="M50 12 L84 86 L67 86 L50 44 L33 86 L16 86 Z" fill="#E6DED1"/>
    <path d="M50 50 L62 78 L38 78 Z" fill="#6E5C52"/>
  </svg>
  <div class="splash-name wordmark">إتقان</div>
  <div class="splash-bar"><i></i></div>
  <div class="splash-sub">منصة جاهزية مخيمات الحج وإدارة البلاغات الميدانية</div>
  <div class="splash-brand">A R K I N I U M</div>
</div>

<div id="app"></div>
<div id="toast" hidden><div class="t"></div></div>
<div id="modal" hidden><div class="m-back" data-close></div><div class="m-card" id="m-card"></div></div>
<input type="file" id="capInput" accept="image/*" capture="environment" hidden>

<script>
"use strict";
/* ============================================================ إتقان ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const el=(t,a={},c=[])=>{const n=document.createElement(t);
  for(const[k,v]of Object.entries(a)){if(v==null||v===false)continue;
    if(k==="class")n.className=v;else if(k==="html")n.innerHTML=v;
    else if(k.slice(0,2)==="on"&&typeof v==="function")n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);}
  for(const x of [].concat(c)){if(x==null||x===false)continue;n.appendChild(typeof x==="object"?x:document.createTextNode(String(x)));}
  return n;};
const uid=()=>"x"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const hash=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return"h"+h.toString(16);};

const MASHAER={mina:"منى",arafat:"عرفات",muzdalifah:"مزدلفة"};
const PERIODS=["الفترة الصباحية","الفترة المسائية","الفترة الليلية"];
const PKG={A:"الباقة أ",B:"الباقة ب",C:"الباقة ج",D:"الباقة د"};
const ROLES={admin:"الأدمن",field:"مشرف ميداني",executive:"مشرف تنفيذي",manager:"المدير",secretary:"السكرتير"};
const REP_STATUS={new:"جديد",in_progress:"قيد المعالجة",escalated:"مُصعّد",resolved:"تمت المعالجة",closed:"مغلق"};
const FIELD_TYPES={status:"متوفر/غير متوفر",yesno:"نعم/لا",text:"نص",number:"رقم",select:"قائمة اختيار",note:"ملاحظة طويلة"};

/* ---------- storage ---------- */
const S={get(k,d){try{const v=localStorage.getItem("itqan_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("itqan_"+k,JSON.stringify(v));}catch(e){toast("مساحة التخزين ممتلئة","bad");}}};
const T={users:()=>S.get("users",[]),centers:()=>S.get("centers",[]),fields:()=>S.get("fields",[]),
  evals:()=>S.get("evals",[]),reports:()=>S.get("reports",[]),sigs:()=>S.get("sigs",[]),
  notifs:()=>S.get("notifs",[]),circulars:()=>S.get("circulars",[])};

/* ---------- IndexedDB for photos/files ---------- */
const IDB={db:null,ok:false,init(){return new Promise(res=>{try{const r=indexedDB.open("itqanFiles",1);
  r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains("f"))d.createObjectStore("f");};
  r.onsuccess=e=>{this.db=e.target.result;this.ok=true;res();};r.onerror=()=>{this.ok=false;res();};}catch(e){this.ok=false;res();}});},
  put(blob){return new Promise(async(res,rej)=>{const id=uid();if(this.ok){try{const tx=this.db.transaction("f","readwrite");tx.objectStore("f").put(blob,id);tx.oncomplete=()=>res(id);tx.onerror=()=>rej(tx.error);return;}catch(e){}}
    try{const u=await blobToURL(blob);S.set("f_"+id,u);res(id);}catch(e){rej(e);}});},
  url(id){return new Promise(res=>{if(!id)return res(null);if(this.ok){try{const tx=this.db.transaction("f","readonly");const q=tx.objectStore("f").get(id);q.onsuccess=()=>res(q.result?URL.createObjectURL(q.result):(S.get("f_"+id,null)));q.onerror=()=>res(S.get("f_"+id,null));return;}catch(e){}}res(S.get("f_"+id,null));});}};

function captureDoc(meta,onDone){
  const inp=$("#capInput");inp.value="";
  inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
    try{toast("جارٍ ختم الصورة...");const blob=await watermark(f,meta);const id=await IDB.put(blob);const url=await IDB.url(id);onDone(id,url);}
    catch(e){toast("تعذّر معالجة الصورة","bad");}};

}
function watermark(file,meta){return new Promise((res,rej)=>{
  const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{try{
    const maxW=1280;let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;const x=cv.getContext("2d");
    x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    const d=new Date();const pad=Math.round(w*0.03);const fs=Math.max(13,Math.round(w*0.026));
    const lines=[
      {t:(meta.centerName||"موقع غير محدد"),b:true},
      {t:"الإحداثيات: "+(meta.lat||"—")+" , "+(meta.lng||"—")},
      {t:"مركز رقم: "+(meta.centerNo||"—")+"   |   شاخص رقم: "+(meta.shaakhisNo||"—")},
      {t:gregStr(d)},
      {t:hijriStr(d)},
      {t:"المشرف: "+(meta.supervisor||"—")},
    ];
    const lh=fs*1.5;const panelH=lh*lines.length+fs*2.4+pad;
    const g=x.createLinearGradient(0,h-panelH,0,h);g.addColorStop(0,"rgba(42,34,30,0)");g.addColorStop(.28,"rgba(42,34,30,.74)");g.addColorStop(1,"rgba(42,34,30,.92)");
    x.fillStyle=g;x.fillRect(0,h-panelH,w,panelH);
    // accent bar
    x.fillStyle="#D6C9B8";x.fillRect(w-pad-Math.round(w*0.10),h-panelH+pad*0.6,Math.round(w*0.10),Math.max(3,Math.round(w*0.006)));
    x.textAlign="right";x.direction="rtl";
    let yy=h-panelH+pad+fs*1.4;
    lines.forEach((ln,i)=>{
      x.fillStyle=i===0?"#F4F1EA":"#E6DED1";
      x.font=(ln.b?"700 ":"500 ")+(ln.b?Math.round(fs*1.18):fs)+'px "IBM Plex Sans Arabic",Tahoma,sans-serif';
      x.shadowColor="rgba(0,0,0,.5)";x.shadowBlur=3;
      x.fillText(ln.t,w-pad,yy);yy+=ln.b?lh*1.15:lh;
    });
    x.shadowBlur=0;
    // footer brand
    x.textAlign="left";x.fillStyle="#B7A590";x.font="700 "+Math.round(fs*0.82)+'px "IBM Plex Sans Arabic",Tahoma,sans-serif';
    x.fillText("ARKINIUM • SECURE DOCUMENTATION",pad,h-pad*0.9);
    cv.toBlob(b=>b?res(b):rej(new Error("blob")),"image/jpeg",0.78);
  }catch(e){rej(e);}};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"));};img.src=u;});}

/* ============================================================ REPORT DETAIL + workflow ============================================================ */
function showReport(r){
  const role=Session.user.role;const c=el("div",{});
  c.appendChild(el("h3",{},r.title));

  c.appendChild(el("div",{style:"padding:8px 0;font-size:13.5px"},r.description));

  // timeline
  c.appendChild(el("div",{class:"sec-title",style:"margin-top:12px"},["سجل المتابعة",el("span",{class:"line"})]));
  const tl=el("div",{class:"tl"});
  (r.timeline||[]).forEach(t=>{const meta=t.by+" · "+fmt(t.at)+(t.note?" — "+t.note:"");
    tl.appendChild(el("div",{class:"tl-item"},[el("div",{class:"tl-h"},t.action),el("div",{class:"tl-m"},meta)]));});
  c.appendChild(tl);
  // executive actions
  if(role==="executive"&&r.status!=="closed"){
    c.appendChild(el("div",{class:"divider"}));
    const note=el("input",{type:"text",placeholder:"ملاحظة متابعة (اختياري)"});c.appendChild(note);
    const acts=el("div",{style:"display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"});
    if(r.status==="new")acts.appendChild(el("button",{class:"btn",onclick:()=>repAction(r,"in_progress","بدء المعالجة",note.value)},"▶ استلام ومعالجة"));

    acts.appendChild(el("button",{class:"btn ok",onclick:()=>repAction(r,"resolved","تمت المعالجة",note.value,true)},"✔ تمت المعالجة وإغلاق"));

  }
  if(role==="manager"&&r.status==="escalated"){
    c.appendChild(el("div",{class:"divider"}));
    c.appendChild(el("button",{class:"btn ok block",onclick:()=>repAction(r,"resolved","اعتماد الحل من المدير","",true)},"✔ اعتماد المعالجة وإغلاق"));
  }
  c.appendChild(el("button",{class:"btn ghost block",style:"margin-top:10px",onclick:closeModal},"إغلاق"));modal(c);
}
function repAction(r,status,action,note,close){
  const reports=T.reports();const i=reports.findIndex(x=>x.id===r.id);if(i<0)return;
  reports[i].status=status;reports[i].timeline.push({at:now(),by:Session.user.name,action,note:note||""});
  if(status==="in_progress"&&!reports[i].assignedToId)reports[i].assignedToId=Session.user.id;
  if(close){reports[i].status="closed";reports[i].closed_at=now();reports[i].closedById=Session.user.id;
    reports[i].timeline.push({at:now(),by:Session.user.name,action:"إغلاق البلاغ"});
    notify(reports[i].supervisorId,"تم إغلاق بلاغك ✅",reports[i].title+" — "+reports[i].centerName+" (تمت المعالجة)","ok","f-reports");}
  else if(status==="escalated"){notifyRole("manager","بلاغ مُصعّد: "+reports[i].title,reports[i].centerName,"bad");}
  S.set("reports",reports);toast(close?"تم إغلاق البلاغ وإشعار المشرف":"تم التحديث","ok");closeModal();shell(tabsFor());
}

/* ============================================================ EXECUTIVE ============================================================ */
function execReports(v){

  v.appendChild(el("div",{class:"chips"},[["active","النشطة"],["new","الجديدة"],["in_progress","قيد المعالجة"],["escalated","المُصعّدة"],["closed","المغلقة"]]
    .map(([k,l])=>el("button",{class:"chip"+(fil===k?" active":""),onclick:()=>{v._fil=k;paintTab();}},l))));

/* ============================================================ MANAGER ============================================================ */

    else{fb.appendChild(el("button",{class:"cap-btn",onclick:()=>inp.click()},"📎 إرفاق ملف"));fb.appendChild(el("div",{class:"hint",style:"margin:0"},"PDF أو صورة (اختياري)"));}};

    el("button",{class:"btn block",onclick:()=>{if(!ti.value.trim())return toast("العنوان مطلوب","bad");
      const sigs=T.sigs();sigs.push({id:uid(),title:ti.value.trim(),note:no.value.trim(),kind,fileId:file.id||null,fileName:file.name||null,fileImg:!!file.isImg,status:"pending",fromId:Session.user.id,fromName:Session.user.name,created_at:now(),decided_at:null,decision:null});S.set("sigs",sigs);
      notifyRole("manager",(kind==="sign"?"طلب توقيع":"طلب اعتماد")+": "+ti.value.trim(),"من "+Session.user.name,"warn");

function sigItem(s){const map={pending:"p-warn",approved:"p-ok",signed:"p-ok",rejected:"p-bad"};const lbl={pending:"بانتظار المدير",approved:"معتمد",signed:"موقّع ومعتمد",rejected:"مرفوض"};

function showSig(s){const role=Session.user.role;const c=el("div",{});c.appendChild(el("h3",{},s.title));
  c.appendChild(el("div",{class:"d-row"},[el("span",{class:"k"},"النوع"),el("span",{class:"v"},s.kind==="sign"?"توقيع المدير":"اعتماد بدون توقيع")]));
  c.appendChild(el("div",{class:"d-row"},[el("span",{class:"k"},"مقدّم الطلب"),el("span",{class:"v"},s.fromName)]));
  c.appendChild(el("div",{class:"d-row"},[el("span",{class:"k"},"التاريخ"),el("span",{class:"v"},fmt(s.created_at))]));

function managerSigs(v){

function tabsFor(){const r=Session.user.role;
  if(r==="admin")return[{id:"a-home",label:"الرئيسية",icon:"🏠",render:adminOverview},{id:"a-users",label:"المستخدمون",icon:"👥",render:adminUsers},
    {id:"a-centers",label:"المراكز",icon:"📍",render:adminCenters},{id:"a-form",label:"الفورم",icon:"🧩",render:adminForm},{id:"a-comms",label:"التعاميم",icon:"📢",render:adminComms}];
  if(r==="field")return[{id:"f-new",label:"تقييم",icon:"📝",render:fieldNewEval},{id:"f-evals",label:"تقييماتي",icon:"📋",render:fieldEvals},
    {id:"f-report",label:"بلاغ",icon:"➕",render:fieldNewReport},{id:"f-reports",label:"بلاغاتي",icon:"📮",render:fieldReports}];
  if(r==="executive")return[{id:"e-reports",label:"البلاغات",icon:"📮",render:execReports}];
  if(r==="manager")return[{id:"m-dash",label:"اللوحة",icon:"📊",render:managerDash},{id:"m-reports",label:"البلاغات",icon:"📮",render:managerReports},{id:"m-sigs",label:"الاعتمادات",icon:"✍",render:managerSigs}];

}

(async function(){

  setTimeout(()=>{splash.classList.add("hide");setTimeout(()=>splash.remove(),700);},2300);
